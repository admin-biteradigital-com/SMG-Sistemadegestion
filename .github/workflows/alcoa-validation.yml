# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  WORKFLOW: ALCOA+ VALIDATION                                          ║
# ║  Propósito: Garantizar integridad forense de cada cambio              ║
# ║  Autoridad: Zelmar Tiago Velazquez Borges                             ║
# ║  Versión: 1.0-soberano                                                ║
# ╚═══════════════════════════════════════════════════════════════════════╝

name: 🔐 ALCOA+ Validation

on:
  push:
    branches: [main, develop, 'fase*']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  SGI_ORGANIZATION: "Bitera Digital"
  ARQUITECTO_SOBERANO: "Zelmar Tiago Velazquez Borges"

jobs:
  # ============================================================================
  # JOB 1: ATRIBUTABLE - Verificación de identidad del autor
  # ============================================================================
  attributable:
    name: "👤 A - Atribuible (Identidad Verificada)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verificar firma GPG en commits
        id: gpg-verify
        run: |
          echo "🔍 Verificando firmas GPG en commits del push..."
          
          # Obtener rango de commits
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA)
          else
            COMMITS=$(git rev-list ${{ github.event.before }}..${{ github.event.after }} 2>/dev/null || echo "${{ github.sha }}")
          fi
          
          FAILED=0
          for commit in $COMMITS; do
            echo "Verificando commit: $commit"
            if ! git verify-commit $commit --verbose 2>/dev/null; then
              echo "❌ ERROR: Commit $commit NO está firmado GPG"
              FAILED=1
            else
              SIGNER=$(git verify-commit $commit --verbose 2>&1 | grep "using RSA key" | head -1)
              echo "✅ Firmado: $SIGNER"
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "::error::Commits sin firma GPG detectados. Todos los commits deben ser firmados."
            exit 1
          fi
          
          echo "✅ Todos los commits tienen firma GPG válida"

      - name: Validar mapeo agente-firma
        run: |
          echo "📋 Agentes autorizados y sus claves GPG:"
          echo "AGENTE-01: [PENDIENTE - configurar en secrets]"
          echo "AGENTE-02: [PENDIENTE - configurar en secrets]"
          echo "AGENTE-03: [PENDIENTE - configurar en secrets]"
          echo "AGENTE-04: [PENDIENTE - configurar en secrets]"
          echo "AGENTE-05: [PENDIENTE - configurar en secrets]"
          echo "Zelmar: ${{ secrets.GPG_KEY_ZELMAR_FINGERPRINT }}"

  # ============================================================================
  # JOB 2: LEGIBLE - Estructura y claridad del mensaje
  # ============================================================================
  legible:
    name: "📖 L - Legible (Formato ALCOA+)"
    runs-on: ubuntu-latest
    needs: attributable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar formato de mensajes de commit
        run: |
          echo "🔍 Validando formato ALCOA+ de mensajes..."
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA)
          else
            COMMITS=$(git rev-list ${{ github.event.before }}..${{ github.event.after }} 2>/dev/null || echo "${{ github.sha }}")
          fi
          
          FAILED=0
          for commit in $COMMITS; do
            MESSAGE=$(git log -1 --pretty=format:"%B" $commit)
            echo "Analizando commit $commit..."
            
            # Validar identificador SGI en línea de asunto
            if ! echo "$MESSAGE" | head -1 | grep -qE '^\[(GOV|GOB|SEC|BCM|PLAN|ARQ|INFRA|SOP|AUD|REG)-[0-9]+\]'; then
              echo "❌ ERROR: Línea de asunto sin identificador SGI válido"
              echo "   Esperado: [PREFIX-XX] Tipo: Descripción"
              FAILED=1
            fi
            
            # Validar referencia a documento SGI
            if ! echo "$MESSAGE" | grep -qE 'Referencia:'; then
              echo "❌ ERROR: Falta 'Referencia:' a documento SGI"
              FAILED=1
            fi
            
            # Validar sección de Firmas
            if ! echo "$MESSAGE" | grep -qE 'Firmas:'; then
              echo "❌ ERROR: Falta sección 'Firmas:'"
              FAILED=1
            fi
            
            # Validar timestamp ISO 8601 en firmas
            if ! echo "$MESSAGE" | grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'; then
              echo "❌ ERROR: Timestamps no en formato ISO 8601"
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "::error::Formato ALCOA+ incorrecto. Ver SOP-01-Procedimiento-Commit.md"
            exit 1
          fi
          
          echo "✅ Formato ALCOA+ validado correctamente"

  # ============================================================================
  # JOB 3: CONTEMPORANEO - Sincronización temporal
  # ============================================================================
  contemporaneous:
    name: "⏱️ C - Contemporáneo (Tiempo Verificado)"
    runs-on: ubuntu-latest
    needs: attributable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar sincronización NTP (simulado)
        run: |
          echo "🔍 Validando contemporaneidad de registros..."
          
          CURRENT_TIME=$(date -u +%s)
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA)
          else
            COMMITS=$(git rev-list ${{ github.event.before }}..${{ github.event.after }} 2>/dev/null || echo "${{ github.sha }}")
          fi
          
          for commit in $COMMITS; do
            COMMIT_TIME=$(git log -1 --format=%ct $commit)
            DIFF=$((CURRENT_TIME - COMMIT_TIME))
            
            # Validar que commit no sea del futuro (tolerancia 5 min)
            if [ $DIFF -lt -300 ]; then
              echo "❌ ERROR: Commit $commit tiene timestamp futuro"
              exit 1
            fi
            
            # Warning si commit tiene más de 30 días (revisión manual)
            if [ $DIFF -gt 2592000 ]; then
              echo "⚠️ WARNING: Commit $commit tiene más de 30 días"
            fi
          done
          
          echo "✅ Contemporaneidad validada"

      - name: Generar attestation de tiempo
        run: |
          echo "📝 Generando attestation GitHub..."
          mkdir -p .github/attestations
          echo "workflow_run_id: ${{ github.run_id }}" > .github/attestations/${{ github.sha }}.yml
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/attestations/${{ github.sha }}.yml
          echo "repository: ${{ github.repository }}" >> .github/attestations/${{ github.sha }}.yml

  # ============================================================================
  # JOB 4: ORIGINAL - Sin alteraciones posteriores
  # ============================================================================
  original:
    name: "🔒 O - Original (Integridad de Fuente)"
    runs-on: ubuntu-latest
    needs: [attributable, legible]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar integridad de historial
        run: |
          echo "🔍 Verificando que no haya rewrites de historial..."
          
          # Detectar force pushes en PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Verificación de integridad en PR #${{ github.event.pull_request.number }}"
            
            # Validar que no haya commits duplicados (signo de rebase agresivo)
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            
            UNIQUE_COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA | wc -l)
            echo "Commits únicos en PR: $UNIQUE_COMMITS"
          fi
          
          echo "✅ Integridad de fuente validada"

  # ============================================================================
  # JOB 5: EXACTO - Precisión técnica
  # ============================================================================
  exacto:
    name: "🎯 E - Exacto (Precisión Técnica)"
    runs-on: ubuntu-latest
    needs: [legible, contemporaneous]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar referencias cruzadas SGI
        run: |
          echo "🔍 Validando referencias cruzadas documentos SGI..."
          
          # Extraer identificadores mencionados en commits
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            MESSAGES=$(git log $BASE_SHA..$HEAD_SHA --pretty=format:"%B")
          else
            MESSAGES=$(git log -1 --pretty=format:"%B")
          fi
          
          # Validar que documentos referenciados existen
          REFS=$(echo "$MESSAGES" | grep -oE '\b(GOV|GOB|SEC|BCM|PLAN|ARQ|INFRA|SOP|AUD|REG)-[0-9]+\b' | sort -u)
          
          for ref in $REFS; do
            PREFIX=$(echo $ref | cut -d'-' -f1)
            FILE_PATTERN=$(echo $ref | tr '[:upper:]' '[:lower:]')
            
            # Buscar archivo correspondiente
            FOUND=$(find docs -iname "*${FILE_PATTERN}*" 2>/dev/null | head -1)
            
            if [ -z "$FOUND" ]; then
              echo "⚠️ WARNING: Documento referenciado no encontrado: $ref"
            else
              echo "✅ Referencia válida: $ref → $FOUND"
            fi
          done
          
          echo "✅ Validación de referencias completada"

      - name: Validar estructura de directorios
        run: |
          echo "🔍 Validando estructura SGI..."
          
          REQUIRED_DIRS=(
            "docs/ESTRATO-I-GOBIERNO"
            "docs/ESTRATO-II-PLANIFICACION"
            "docs/ESTRATO-III-OPERACION"
            "docs/ESTRATO-IV-EVIDENCIA/registros"
            "docs/ESTRATO-IV-EVIDENCIA/auditorias"
            "docs/ESTRATO-IV-EVIDENCIA/aar"
            "src/core"
            "src/tenants/smg"
            "tests"
          )
          
          FAILED=0
          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Directorio requerido no existe: $dir"
              FAILED=1
            else
              echo "✅ $dir"
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "::error::Estructura SGI incompleta"
            exit 1
          fi

  # ============================================================================
  # JOB 6: PLUS - Completitud, Consistencia, Duradero, Disponible
  # ============================================================================
  plus:
    name: "➕ + PLUS (Calidad Extendida)"
    runs-on: ubuntu-latest
    needs: [original, exacto]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar completitud de metadatos
        run: |
          echo "🔍 Validando completitud ALCOA+..."
          
          if [ ! -f "CHANGELOG.md" ]; then
            echo "⚠️ WARNING: CHANGELOG.md no existe"
          fi
          
          echo "✅ Completitud validada"

      - name: Generar reporte ALCOA+
        run: |
          echo "📊 Generando reporte de validación..."
          mkdir -p .github/attestations
          
          cat > .github/attestations/alcoa-report-${{ github.sha }}.md << 'EOF'
          # Reporte ALCOA+ - Validación ${{ github.run_id }}
          
          | Pilar | Estado | Detalle |
          |:---|:---|:---|
          | **A**ttributable | ✅ PASS | Firmas GPG verificadas |
          | **L**egible | ✅ PASS | Formato SGI correcto |
          | **C**ontemporaneous | ✅ PASS | Sincronización temporal válida |
          | **O**riginal | ✅ PASS | Integridad de fuente confirmada |
          | **E**xacto | ✅ PASS | Referencias cruzadas válidas |
          | **+** Plus | ✅ PASS | Calidad extendida validada |
          
          **Validado por:** GitHub Actions  
          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)  
          **Commit:** ${{ github.sha }}
          EOF

      - name: Upload attestation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alcoa-attestation-${{ github.sha }}
          path: .github/attestations/
          retention-days: 2555

  # ============================================================================
  # JOB FINAL: Consolidación y estado
  # ============================================================================
  alcoa-consolidated:
    name: "🏛️ ALCOA+ Consolidado"
    runs-on: ubuntu-latest
    needs: [attributable, legible, contemporaneous, original, exacto, plus]
    if: always()
    steps:
      - name: Final check
        run: |
          if [ "${{ needs.attributable.result }}" != "success" ] || \
             [ "${{ needs.legible.result }}" != "success" ] || \
             [ "${{ needs.exacto.result }}" != "success" ]; then
            echo "❌ VALIDACIÓN ALCOA+ FALLIDA"
            exit 1
          fi
          echo "✅ TODOS LOS PILARES ALCOA+ VALIDADOS"
